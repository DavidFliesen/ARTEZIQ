name: Explorer Unified Application Tests

on:
  push:
    branches:
      - explorer-unified-onboarding-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unified application HTML and JavaScript contract
        run: node --test tests/explorer-unified.test.cjs tests/explorer-unified-server.test.cjs

  deployed-endpoint-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed unified Apps Script health (GET only)
        run: node scripts/check-unified-endpoint.mjs

  browser-invalid-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser control library
        run: npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.56.1
      - name: Check Chrome installation
        run: test -x /usr/bin/google-chrome
      - name: Test cross-origin invalid POST from a real browser (cannot send email)
        run: node scripts/check-unified-browser-post.mjs

  webkit-form-mock:
    if: github.event_name == 'workflow_dispatch' # slower Safari-engine verification, manual only
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and PDF runtime
        run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1 jspdf@2.5.1
      - name: Install Safari-like WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Test mobile unified NDA form with all email requests intercepted
        run: node scripts/test-unified-form-webkit.mjs

  chromium-form-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser controller and PDF runtime
        run: npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.56.1 jspdf@2.5.1
      - name: Test complete mobile NDA form with mocked delivery
        run: node scripts/test-unified-form-chromium.mjs

  preview-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble isolated development preview files
        run: |
          mkdir -p preview
          cp explorer/apply/index.html preview/index.html
          cp explorer/apply/QA-TESTING.md preview/QA-TESTING.md
      - uses: actions/upload-artifact@v4
        with:
          name: unified-explorer-preview
          path: preview/
          retention-days: 7
